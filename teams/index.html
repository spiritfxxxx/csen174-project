<!DOCTYPE html>
  <head>
    <title>Teams</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="teams.css">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div id="mb-over" onclick="toggleMenuBar()"></div>
    <div id="vs-over" onclick="toggleTeamImporter()"></div>
    <div id="sb">
      <div id="mb-o" onclick="toggleMenuBar()"></div>
      <div id="top" onclick="jumpToTop('body')"></div>
    </div>
    <div id="mb">
      <div id="mb-bar">
        <div id="mb-x" onclick="toggleMenuBar()"></div>
        <div id="mb-nav">
          <a id="mb-home" href="../home/"></a>
        </div>
      </div>
      <div id="mb-cont">
        <div id="mb-header">Your Stuff</div>
        <a href="../schedules/" style="color:#b2cee7;text-decoration:underline;">Schedules</a>
        <a href="../teams/">Teams</a>
        <a href="../meetings/">Meetings</a>
      </div>
    </div>
    <div id="page">
      <div id="vs">
        <div id="vs-bar">
          <div id="vs-x" onclick="toggleTeamImporter()">✖</div>
        </div>
        <div id="vs-cont">
          find team (placeholder)
        </div>
      </div>
      <div id="header">Teams</div>
      <div id="v">
        <div id="v-text" onclick="toggleTeamImporter()">
          <div id="v-name">Find Team</div>
          <div id="v-time">not done</div>
          <div id="v-id">yet (soon™)</div>
        </div>
      </div>
      <button id="team-add" onclick="createTeam()">Create a Team (placeholder)</button>
      <input id="team-input"> Find a Team ID (placeholder)</input>
      <div id="team-list"></div>
    </div>
    </div>
    <script src="teams.js"></script>
  </body>
</html>
