<!DOCTYPE html>
  <head>
    <title>Teams</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="teams.css">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div id="mb-over" onclick="toggleMenuBar()"></div>
    <div id="vs-over1" onclick="toggleTeamImporter()"></div>
    <div id="vs-over2" onclick="toggleTeamJoiner()"></div>
    <div id="sb">
      <div id="mb-o" onclick="toggleMenuBar()"></div>
      <div id="top" onclick="jumpToTop('body')"></div>
    </div>
    <div id="mb">
      <div id="mb-bar">
        <div id="mb-x" onclick="toggleMenuBar()"></div>
        <div id="mb-nav">
          <a id="mb-home" href="../home/"></a>
        </div>
      </div>
      <div id="mb-cont">
        <div id="mb-header">Your Stuff</div>
        <a href="../schedules/">Schedules</a>
        <a href="../teams/" style="color:#b2cee7;text-decoration:underline;">Teams</a>
        <a href="../meetings/">Meetings</a>
      </div>
    </div>
    <div id="page">



      <div id="vs-create">
        <div id="vs-bar">
          <div id="vs-x" onclick="toggleTeamImporter()">✖</div>
        </div>
        <div id="vs-cont">
          <input id="vs-team"></input>
          <div id="vs-text">name your team</div>
        </div>
      </div>
      <div id="vs-join">
        <div id="vs-bar">
          <div id="vs-x" onclick="toggleTeamJoiner()">✖</div>
        </div>
        <div id="vs-cont">
          <input id="vs-code"></input>
          <div id="vs-text">enter a team code</div>
        </div>
      </div>



      <div id="header">Teams</div>
      <div id="v">
        <div id="v-create" onclick="toggleTeamImporter()">
          <div id="v-name">Create a Team</div>
          <div id="v-time">press me!</div>
          <div id="v-id">generates a team code</div>
        </div>
        <div id="v-join" onclick="toggleTeamJoiner()">
          <div id="v-name">Join a Team</div>
          <div id="v-time">press me too!</div>
          <div id="v-id">enter a team code</div>
        </div>
      </div>
      <div id="team-list"></div>
    </div>
    </div>
    <script src="teams.js"></script>
  </body>
</html>
